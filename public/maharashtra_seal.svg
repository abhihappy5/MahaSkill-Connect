<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%" role="img" aria-label="Official Seal of the Government of Maharashtra">
  <defs>
    <!-- Rich Golden & Saffron Gradients -->
    <radialGradient id="sealBgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#fef08a" />
      <stop offset="55%" stopColor="#fde047" />
      <stop offset="85%" stopColor="#facc15" />
      <stop offset="100%" stopColor="#eab308" />
    </radialGradient>

    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#ffffff" stopOpacity="0.6" />
      <stop offset="60%" stopColor="#fef08a" stopOpacity="0.2" />
      <stop offset="100%" stopColor="#f59e0b" stopOpacity="0" />
    </radialGradient>

    <linearGradient id="petalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#fef08a" />
      <stop offset="40%" stopColor="#facc15" />
      <stop offset="100%" stopColor="#d97706" />
    </linearGradient>

    <linearGradient id="lampGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#ea580c" />
      <stop offset="30%" stopColor="#d97706" />
      <stop offset="70%" stopColor="#ca8a04" />
      <stop offset="100%" stopColor="#b45309" />
    </linearGradient>

    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stopColor="#ea580c" />
      <stop offset="50%" stopColor="#f59e0b" />
      <stop offset="100%" stopColor="#fef08a" />
    </linearGradient>

    <!-- Circular Text Paths -->
    <path id="textPathTop" d="M 32 120 A 88 88 0 0 1 208 120" fill="none" />
    <path id="textPathBottom" d="M 208 120 A 88 88 0 0 1 32 120" fill="none" />
  </defs>

  <!-- Outer Radiating Lotus Petals Garland (36 Petals) -->
  <g transform="translate(120, 120)">
    <!-- 36 Petals array -->
    <g id="petals">
      <!-- Generated 36 radiant petals around 360 deg -->
      <g transform="rotate(0)"><path d="M 0 -116 C 6 -106 8 -96 0 -88 C -8 -96 -6 -106 0 -116 Z" fill="url(#petalGrad)" stroke="#c2410c" stroke-width="1.2" /></g>
      <g transform="rotate(10)"><path d="M 0 -116 C 6 -106 8 -96 0 -88 C -8 -96 -6 -106 0 -116 Z" fill="url(#petalGrad)" stroke="#c2410c" stroke-width="1.2" /></g>
      <g transform="rotate(20)"><path d="M 0 -116 C 6 -106 8 -96 0 -88 C -8 -96 -6 -106 0 -116 Z" fill="url(#petalGrad)" stroke="#c2410c" stroke-width="1.2" /></g>
      <g transform="rotate(30)"><path d="M 0 -116 C 6 -106 8 -96 0 -88 C -8 -96 -6 -106 0 -116 Z" fill="url(#petalGrad)" stroke="#c2410c" stroke-width="1.2" /></g>
      <g transform="rotate(40)"><path d="M 0 -116 C 6 -106 8 -96 0 -88 C -8 -96 -6 -106 0 -116 Z" fill="url(#petalGrad)" stroke="#c2410c" stroke-width="1.2" /></g>
      <g transform="rotate(50)"><path d="M 0 -116 C 6 -106 8 -96 0 -88 C -8 -96 -6 -106 0 -116 Z" fill="url(#petalGrad)" stroke="#c2410c" stroke-width="1.2" /></g>
      <g transform="rotate(60)"><path d="M 0 -116 C 6 -106 8 -96 0 -88 C -8 -96 -6 -106 0 -116 Z" fill="url(#petalGrad)" stroke="#c2410c" stroke-width="1.2" /></g>
      <g transform="rotate(70)"><path d="M 0 -116 C 6 -106 8 -96 0 -88 C -8 -96 -6 -106 0 -116 Z" fill="url(#petalGrad)" stroke="#c2410c" stroke-width="1.2" /></g>
      <g transform="rotate(80)"><path d="M 0 -116 C 6 -106 8 -96 0 -88 C -8 -96 -6 -106 0 -116 Z" fill="url(#petalGrad)" stroke="#c2410c" stroke-width="1.2" /></g>
      <g transform="rotate(90)"><path d="M 0 -116 C 6 -106 8 -96 0 -88 C -8 -96 -6 -106 0 -116 Z" fill="url(#petalGrad)" stroke="#c2410c" stroke-width="1.2" /></g>
      <g transform="rotate(100)"><path d="M 0 -116 C 6 -106 8 -96 0 -88 C -8 -96 -6 -106 0 -116 Z" fill="url(#petalGrad)" stroke="#c2410c" stroke-width="1.2" /></g>
      <g transform="rotate(110)"><path d="M 0 -116 C 6 -106 8 -96 0 -88 C -8 -96 -6 -106 0 -116 Z" fill="url(#petalGrad)" stroke="#c2410c" stroke-width="1.2" /></g>
      <g transform="rotate(120)"><path d="M 0 -116 C 6 -106 8 -96 0 -88 C -8 -96 -6 -106 0 -116 Z" fill="url(#petalGrad)" stroke="#c2410c" stroke-width="1.2" /></g>
      <g transform="rotate(130)"><path d="M 0 -116 C 6 -106 8 -96 0 -88 C -8 -96 -6 -106 0 -116 Z" fill="url(#petalGrad)" stroke="#c2410c" stroke-width="1.2" /></g>
      <g transform="rotate(140)"><path d="M 0 -116 C 6 -106 8 -96 0 -88 C -8 -96 -6 -106 0 -116 Z" fill="url(#petalGrad)" stroke="#c2410c" stroke-width="1.2" /></g>
      <g transform="rotate(150)"><path d="M 0 -116 C 6 -106 8 -96 0 -88 C -8 -96 -6 -106 0 -116 Z" fill="url(#petalGrad)" stroke="#c2410c" stroke-width="1.2" /></g>
      <g transform="rotate(160)"><path d="M 0 -116 C 6 -106 8 -96 0 -88 C -8 -96 -6 -106 0 -116 Z" fill="url(#petalGrad)" stroke="#c2410c" stroke-width="1.2" /></g>
      <g transform="rotate(170)"><path d="M 0 -116 C 6 -106 8 -96 0 -88 C -8 -96 -6 -106 0 -116 Z" fill="url(#petalGrad)" stroke="#c2410c" stroke-width="1.2" /></g>
      <g transform="rotate(180)"><path d="M 0 -116 C 6 -106 8 -96 0 -88 C -8 -96 -6 -106 0 -116 Z" fill="url(#petalGrad)" stroke="#c2410c" stroke-width="1.2" /></g>
      <g transform="rotate(190)"><path d="M 0 -116 C 6 -106 8 -96 0 -88 C -8 -96 -6 -106 0 -116 Z" fill="url(#petalGrad)" stroke="#c2410c" stroke-width="1.2" /></g>
      <g transform="rotate(200)"><path d="M 0 -116 C 6 -106 8 -96 0 -88 C -8 -96 -6 -106 0 -116 Z" fill="url(#petalGrad)" stroke="#c2410c" stroke-width="1.2" /></g>
      <g transform="rotate(210)"><path d="M 0 -116 C 6 -106 8 -96 0 -88 C -8 -96 -6 -106 0 -116 Z" fill="url(#petalGrad)" stroke="#c2410c" stroke-width="1.2" /></g>
      <g transform="rotate(220)"><path d="M 0 -116 C 6 -106 8 -96 0 -88 C -8 -96 -6 -106 0 -116 Z" fill="url(#petalGrad)" stroke="#c2410c" stroke-width="1.2" /></g>
      <g transform="rotate(230)"><path d="M 0 -116 C 6 -106 8 -96 0 -88 C -8 -96 -6 -106 0 -116 Z" fill="url(#petalGrad)" stroke="#c2410c" stroke-width="1.2" /></g>
      <g transform="rotate(240)"><path d="M 0 -116 C 6 -106 8 -96 0 -88 C -8 -96 -6 -106 0 -116 Z" fill="url(#petalGrad)" stroke="#c2410c" stroke-width="1.2" /></g>
      <g transform="rotate(250)"><path d="M 0 -116 C 6 -106 8 -96 0 -88 C -8 -96 -6 -106 0 -116 Z" fill="url(#petalGrad)" stroke="#c2410c" stroke-width="1.2" /></g>
      <g transform="rotate(260)"><path d="M 0 -116 C 6 -106 8 -96 0 -88 C -8 -96 -6 -106 0 -116 Z" fill="url(#petalGrad)" stroke="#c2410c" stroke-width="1.2" /></g>
      <g transform="rotate(270)"><path d="M 0 -116 C 6 -106 8 -96 0 -88 C -8 -96 -6 -106 0 -116 Z" fill="url(#petalGrad)" stroke="#c2410c" stroke-width="1.2" /></g>
      <g transform="rotate(280)"><path d="M 0 -116 C 6 -106 8 -96 0 -88 C -8 -96 -6 -106 0 -116 Z" fill="url(#petalGrad)" stroke="#c2410c" stroke-width="1.2" /></g>
      <g transform="rotate(290)"><path d="M 0 -116 C 6 -106 8 -96 0 -88 C -8 -96 -6 -106 0 -116 Z" fill="url(#petalGrad)" stroke="#c2410c" stroke-width="1.2" /></g>
      <g transform="rotate(300)"><path d="M 0 -116 C 6 -106 8 -96 0 -88 C -8 -96 -6 -106 0 -116 Z" fill="url(#petalGrad)" stroke="#c2410c" stroke-width="1.2" /></g>
      <g transform="rotate(310)"><path d="M 0 -116 C 6 -106 8 -96 0 -88 C -8 -96 -6 -106 0 -116 Z" fill="url(#petalGrad)" stroke="#c2410c" stroke-width="1.2" /></g>
      <g transform="rotate(320)"><path d="M 0 -116 C 6 -106 8 -96 0 -88 C -8 -96 -6 -106 0 -116 Z" fill="url(#petalGrad)" stroke="#c2410c" stroke-width="1.2" /></g>
      <g transform="rotate(330)"><path d="M 0 -116 C 6 -106 8 -96 0 -88 C -8 -96 -6 -106 0 -116 Z" fill="url(#petalGrad)" stroke="#c2410c" stroke-width="1.2" /></g>
      <g transform="rotate(340)"><path d="M 0 -116 C 6 -106 8 -96 0 -88 C -8 -96 -6 -106 0 -116 Z" fill="url(#petalGrad)" stroke="#c2410c" stroke-width="1.2" /></g>
      <g transform="rotate(350)"><path d="M 0 -116 C 6 -106 8 -96 0 -88 C -8 -96 -6 -106 0 -116 Z" fill="url(#petalGrad)" stroke="#c2410c" stroke-width="1.2" /></g>
    </g>
  </g>

  <!-- Golden Disc Background -->
  <circle cx="120" cy="120" r="92" fill="url(#sealBgGrad)" stroke="#c2410c" stroke-width="2" />
  <circle cx="120" cy="120" r="88" fill="none" stroke="#d97706" stroke-width="1" stroke-dasharray="2 2" />
  <circle cx="120" cy="120" r="68" fill="none" stroke="#c2410c" stroke-width="1.5" />
  <circle cx="120" cy="120" r="66" fill="url(#centerGlow)" />

  <!-- Sanskrit Devanagari Inscriptions on Circular Path -->
  <!-- Top Arc: प्रतिपच्चंद्रलेखेव वर्धिष्णुर्विश्व वंदिता -->
  <text font-family="'Noto Sans Devanagari', 'Yantramanav', 'Mangal', sans-serif" font-size="9.5" font-weight="900" fill="#9a3412" letter-spacing="1">
    <textPath href="#textPathTop" startOffset="50%" text-anchor="middle">
      प्रतिपच्चंद्रलेखेव वर्धिष्णुर्विश्व वंदिता
    </textPath>
  </text>

  <!-- Side Decorative Rosette Separator Dots -->
  <circle cx="37" cy="120" r="2.5" fill="#c2410c" />
  <circle cx="203" cy="120" r="2.5" fill="#c2410c" />

  <!-- Bottom Arc: महाराष्ट्रस्य राज्यस्य मुद्रा भद्राय राजते -->
  <text font-family="'Noto Sans Devanagari', 'Yantramanav', 'Mangal', sans-serif" font-size="9.5" font-weight="900" fill="#9a3412" letter-spacing="1">
    <textPath href="#textPathBottom" startOffset="50%" text-anchor="middle">
      महाराष्ट्रस्य राज्यस्य मुद्रा भद्राय राजते
    </textPath>
  </text>

  <!-- Central Samai / Diya (Traditional Maharashtrian Brass Oil Lamp) -->
  <g transform="translate(120, 122)">
    <!-- 1. Lamp Pedestal & Base Steps -->
    <!-- Lowest Ring -->
    <ellipse cx="0" cy="46" rx="34" ry="7" fill="#c2410c" />
    <ellipse cx="0" cy="44" rx="32" ry="6" fill="#facc15" stroke="#9a3412" stroke-width="1.2" />
    <ellipse cx="0" cy="42" rx="26" ry="4.5" fill="#fef08a" />

    <!-- Tier 2 Base -->
    <ellipse cx="0" cy="36" rx="24" ry="5.5" fill="#c2410c" />
    <ellipse cx="0" cy="34" rx="22" ry="4.8" fill="#facc15" stroke="#9a3412" stroke-width="1.2" />

    <!-- 2. Central Baluster / Pillar -->
    <path d="M -6 32 C -8 24 -4 16 0 16 C 4 16 8 24 6 32 Z" fill="#facc15" stroke="#9a3412" stroke-width="1.2" />
    <!-- Ornamental Ring on Pillar -->
    <ellipse cx="0" cy="20" rx="9" ry="3.2" fill="#ea580c" />
    <ellipse cx="0" cy="19" rx="8" ry="2.6" fill="#fde047" stroke="#9a3412" stroke-width="1" />
    <circle cx="0" cy="19" r="2.5" fill="#c2410c" />

    <!-- 3. Upper Oil Bowl (Deepa-Patra) -->
    <path d="M -32 -6 C -26 14 26 14 32 -6 C 18 1 -18 1 -32 -6 Z" fill="#facc15" stroke="#9a3412" stroke-width="1.5" />
    <ellipse cx="0" cy="-6" rx="32" ry="5.5" fill="#fde047" stroke="#9a3412" stroke-width="1.2" />

    <!-- 4. Five Radiating Flames / Wicks -->
    <!-- Far Left Flame -->
    <path d="M -26 -8 C -36 -20 -28 -32 -22 -28 C -18 -24 -20 -12 -26 -8 Z" fill="url(#flameGrad)" stroke="#c2410c" stroke-width="1" />
    
    <!-- Mid Left Flame -->
    <path d="M -14 -9 C -20 -25 -12 -38 -8 -34 C -4 -30 -8 -15 -14 -9 Z" fill="url(#flameGrad)" stroke="#c2410c" stroke-width="1" />

    <!-- Center Pinnacle Flame (Main Jyoti) -->
    <path d="M 0 -11 C -7 -30 0 -48 0 -52 C 0 -48 7 -30 0 -11 Z" fill="url(#flameGrad)" stroke="#c2410c" stroke-width="1.2" />

    <!-- Mid Right Flame -->
    <path d="M 14 -9 C 8 -15 4 -30 8 -34 C 12 -38 20 -25 14 -9 Z" fill="url(#flameGrad)" stroke="#c2410c" stroke-width="1" />

    <!-- Far Right Flame -->
    <path d="M 26 -8 C 20 -12 18 -24 22 -28 C 28 -32 36 -20 26 -8 Z" fill="url(#flameGrad)" stroke="#c2410c" stroke-width="1" />

    <!-- 5. Ornamental Crown / Finial at Top Center -->
    <path d="M -4 -38 C -7 -44 0 -50 0 -50 C 0 -50 7 -44 4 -38 C 2 -35 -2 -35 -4 -38 Z" fill="#fde047" stroke="#9a3412" stroke-width="0.8" />
    <circle cx="0" cy="-36" r="2.2" fill="#c2410c" />
    <circle cx="0" cy="-48" r="1.5" fill="#fef08a" />
  </g>
</svg>
